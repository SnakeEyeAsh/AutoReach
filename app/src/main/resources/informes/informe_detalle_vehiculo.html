<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Vehiculo - AutoReach</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f8fafc;
            color: #1f2937;
            padding: 15px;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #1E3A8A, #3B82F6);
            color: white;
            padding: 15px;
            text-align: center;
        }
        .card-header h2 {
            font-size: 16px;
            margin: 0;
        }
        .card-header .matricula {
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }
        .card-body { padding: 15px; }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .info-item {
            background: #f9fafb;
            padding: 10px;
            border-radius: 8px;
            border-left: 3px solid #F97316;
        }
        .info-item.full-width {
            grid-column: span 2;
        }
        .info-label {
            font-size: 11px;
            color: #6B7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: #1E3A8A;
            margin-top: 2px;
        }
        .price-section {
            background: linear-gradient(135deg, #DBEAFE, #E0E7FF);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-top: 15px;
        }
        .price-label {
            font-size: 12px;
            color: #6B7280;
        }
        .price-value {
            font-size: 28px;
            font-weight: bold;
            color: #1E3A8A;
        }
        .specs-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #E5E7EB;
        }
        .specs-title {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 10px;
        }
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .spec-item {
            background: #f0f9ff;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
        }
        .spec-label {
            font-size: 10px;
            color: #6B7280;
        }
        .spec-value {
            font-size: 12px;
            font-weight: 600;
            color: #0369a1;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h2>Ficha del Vehiculo</h2>
            <div class="matricula">{{MATRICULA}}</div>
        </div>
        <div class="card-body">
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Marca</div>
                    <div class="info-value">{{MARCA}}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Modelo</div>
                    <div class="info-value">{{MODELO}}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Año</div>
                    <div class="info-value">{{AÑO}}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Color</div>
                    <div class="info-value">{{COLOR}}</div>
                </div>
                <div class="info-item full-width">
                    <div class="info-label">Numero de Bastidor</div>
                    <div class="info-value">{{BASTIDOR}}</div>
                </div>
            </div>

            <div class="specs-section">
                <div class="specs-title">Especificaciones</div>
                <div class="specs-grid">
                    <div class="spec-item">
                        <div class="spec-label">Kilometraje</div>
                        <div class="spec-value">{{KMS}} km</div>
                    </div>
                    <div class="spec-item">
                        <div class="spec-label">Diametro Llantas</div>
                        <div class="spec-value">{{DIAMETRO}}"</div>
                    </div>
                    <div class="spec-item">
                        <div class="spec-label">Diseño Llantas</div>
                        <div class="spec-value">{{DISEÑO_LLANTAS}}</div>
                    </div>
                </div>
            </div>

            <div class="price-section">
                <div class="price-label">Precio de Venta</div>
                <div class="price-value">{{PRECIO}} EUR</div>
            </div>
        </div>
    </div>
</body>
</html>
