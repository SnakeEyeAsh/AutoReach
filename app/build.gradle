plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.14'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

// ═══════════════════════════════════════════════════════════════════
// CONFIGURACIÓN DE JAVAFX
// ═══════════════════════════════════════════════════════════════════
javafx {
    version = "21.0.5"
    modules = ['javafx.base', 'javafx.swing', 'javafx.graphics', 'javafx.controls', 'javafx.fxml', 'javafx.media', 'javafx.web']
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'com.javafx.App.App'
    applicationDefaultJvmArgs = [
        '--add-opens', 'javafx.graphics/javafx.scene=org.controlsfx.controls',
        '--add-opens', 'javafx.graphics/javafx.scene=ALL-UNNAMED',
    ]
}

// ═══════════════════════════════════════════════════════════════════
// 1. CONFIGURACIÓN DE RECURSOS (sourceSets)
// ═══════════════════════════════════════════════════════════════════
sourceSets {
    main {
        resources {
            srcDirs = ["src/main/resources"]
            includes = [
                "**/*.fxml",
                "**/*.png",
                "**/*.gif",
                "**/*.jpg",
                "**/*.jpeg",
                "**/*.jasper",
                "**/*.jrxml",
                "**/*.properties",
                "**/*.css",
                "**/*.html",
                "**/*.ttf",
                "**/*.otf"
            ]
        }
    }
}

// ═══════════════════════════════════════════════════════════════════
// 2a. COPIAR DEPENDENCIAS (sin JavaFX) A build/libs/lib
// ═══════════════════════════════════════════════════════════════════
task copyDependencies(type: Copy) {
    description = 'Copia dependencias (sin JavaFX) a build/libs/lib'
    group = 'build'

    from configurations.runtimeClasspath.filter { !it.name.startsWith('javafx-') }
    into "${buildDir}/libs/lib"
    include '**/*.jar'
}

// ═══════════════════════════════════════════════════════════════════
// 2b. COPIAR JARs NATIVOS DE JAVAFX A build/libs/javafx
//     Solo los -win.jar (con código real + DLLs embebidas)
// ═══════════════════════════════════════════════════════════════════
task copyJavaFXLibs(type: Copy) {
    description = 'Copia JARs nativos de JavaFX (Windows) a build/libs/javafx'
    group = 'build'

    from configurations.runtimeClasspath.filter {
        it.name.startsWith('javafx-') && it.name.contains('-win')
    }
    into "${buildDir}/libs/javafx"
}

// ═══════════════════════════════════════════════════════════════════
// 3. CONFIGURACIÓN DEL JAR CON MANIFEST
// ═══════════════════════════════════════════════════════════════════
jar {
    dependsOn copyDependencies

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Diferir la resolución del classpath a la fase de ejecución
    doFirst {
        manifest {
            attributes(
                'Main-Class': application.mainClass.get(),
                'Class-Path': configurations.runtimeClasspath.files
                    .findAll { !it.name.startsWith('javafx-') }
                    .collect { "lib/${it.name}" }
                    .join(' '),
                'Implementation-Title': project.name,
                'Implementation-Version': project.version ?: '1.0.0'
            )
        }
    }

    // Incluir recursos en el JAR
    from(sourceSets.main.resources) {
        include '**/*'
    }
}

// Tarea para construir todo listo para InstallBuilder
task buildForInstaller(dependsOn: ['clean', 'jar', 'copyDependencies', 'copyJavaFXLibs']) {
    description = 'Construye el JAR y copia dependencias para InstallBuilder'
    group = 'distribution'

    doLast {
        println "═══════════════════════════════════════════════════════════"
        println " Build completado para InstallBuilder"
        println " JAR: ${buildDir}/libs/${project.name}.jar"
        println " Dependencias: ${buildDir}/libs/lib/"
        println "═══════════════════════════════════════════════════════════"
    }
}

// ═══════════════════════════════════════════════════════════════════
// DEPENDENCIAS
// ═══════════════════════════════════════════════════════════════════
dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.controlsfx:controlsfx:11.2.1'
    implementation 'io.github.mkpaz:atlantafx-base:2.0.1'
    implementation 'net.sf.jasperreports:jasperreports:7.0.1'
    implementation 'net.sf.jasperreports:jasperreports-pdf:7.0.1'
    implementation 'net.sf.jasperreports:jasperreports-charts:7.0.1'

    // OpenHTMLToPDF para exportar HTML con graficas a PDF
    implementation 'com.openhtmltopdf:openhtmltopdf-core:1.0.10'
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
}

// ═══════════════════════════════════════════════════════════════════
// JPACKAGE — instalador nativo Windows (sin plugin externo)
// ═══════════════════════════════════════════════════════════════════
task jpackage(type: Exec, dependsOn: buildForInstaller) {
    group       = 'distribution'
    description = 'Genera instalador nativo Windows con JavaFX embebido en la JRE'

    def javaHome    = org.gradle.internal.jvm.Jvm.current().javaHome.absolutePath
    def outputDir   = "${buildDir}/jpackage"
    def inputDir    = "${buildDir}/libs"
    def javafxDir   = "${buildDir}/libs/javafx"
    def mainJarName = "${project.name}.jar"

    doFirst {
        file(outputDir).deleteDir()
        file(outputDir).mkdirs()
    }

    commandLine(
        "${javaHome}/bin/jpackage",
        '--type',         'exe',
        '--name',         'AutoReach',
        '--app-version',  '1.0.0',
        '--vendor',       'AutoReach',
        '--description',  'AutoReach - Gestión de concesionario',
        '--input',        inputDir,
        '--main-jar',     mainJarName,
        '--main-class',   'com.javafx.App.App',
        '--module-path',  javafxDir,
        '--add-modules',  'javafx.base,javafx.controls,javafx.fxml,javafx.graphics,javafx.media,javafx.swing,javafx.web,java.sql,java.net.http,java.xml,java.logging,java.naming,java.management,java.desktop,jdk.crypto.ec,jdk.unsupported',
        '--dest',         outputDir,
        '--icon',         'src/main/resources/Assets/autoIcon.ico',
        '--java-options', '--add-opens javafx.graphics/javafx.scene=org.controlsfx.controls',
        '--java-options', '--add-opens javafx.graphics/javafx.scene=ALL-UNNAMED',
        '--java-options', '-Dfile.encoding=UTF-8',
        '--win-dir-chooser',
        '--win-menu',
        '--win-shortcut'
    )

    doLast {
        println "══════════════════════════════════════════════"
        println " Instalador generado en: ${outputDir}/AutoReach"
        println " Ejecuta AutoReach/AutoReach.exe para lanzar"
        println "══════════════════════════════════════════════"
    }
}





