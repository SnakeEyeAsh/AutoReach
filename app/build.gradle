plugins {
  id 'application'
  id 'org.openjfx.javafxplugin' version '0.1.0' //Plugin que ayuda a construir proyectos JAVAFX
}

repositories {
	mavenCentral()
    maven { url 'https://jitpack.io' }
}

javafx {
    version = "25"
    modules = [ 'javafx.base', 'javafx.swing', 'javafx.graphics', 'javafx.controls', 'javafx.fxml', 'javafx.media']
}


java { //Se indica la versión de JDK que ha de utilizar
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

// Configurar codificación UTF-8 para la compilación
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

application { //Definimos clase principal del proyecto
    mainClass = 'com.javafx.App.App'
    applicationDefaultJvmArgs = [
        '--add-opens', 'javafx.graphics/javafx.scene=org.controlsfx.controls',
        '--add-opens', 'javafx.graphics/javafx.scene=ALL-UNNAMED'
    ]
}

sourceSets {
  main {
    resources {
        srcDirs = ["src/main/resources"]
        includes = ["**/*.fxml","**/*.png","**/*.properties"]  //Importante para poder abrir una extensión no reconocida
    }
  }
}
dependencies {

    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'org.controlsfx:controlsfx:11.2.1'
    implementation 'io.github.mkpaz:atlantafx-base:2.0.1'
}





