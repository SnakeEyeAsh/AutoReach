plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.14'
    id 'org.beryx.runtime' version '1.13.1'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

// ═══════════════════════════════════════════════════════════════════
// CONFIGURACIÓN DE JAVAFX
// ═══════════════════════════════════════════════════════════════════
javafx {
    version = "21.0.5"
    modules = ['javafx.base', 'javafx.swing', 'javafx.graphics', 'javafx.controls', 'javafx.fxml', 'javafx.media', 'javafx.web']
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'com.javafx.App.App'
    applicationDefaultJvmArgs = [
        '--add-opens', 'javafx.graphics/javafx.scene=org.controlsfx.controls',
        '--add-opens', 'javafx.graphics/javafx.scene=ALL-UNNAMED',
    ]
}

// ═══════════════════════════════════════════════════════════════════
// 1. CONFIGURACIÓN DE RECURSOS (sourceSets)
// ═══════════════════════════════════════════════════════════════════
sourceSets {
    main {
        resources {
            srcDirs = ["src/main/resources"]
            includes = [
                "**/*.fxml",
                "**/*.png",
                "**/*.gif",
                "**/*.jpg",
                "**/*.jpeg",
                "**/*.jasper",
                "**/*.jrxml",
                "**/*.properties",
                "**/*.css",
                "**/*.html",
                "**/*.ttf",
                "**/*.otf"
            ]
        }
    }
}

// ═══════════════════════════════════════════════════════════════════
// 2. TAREA PARA COPIAR DEPENDENCIAS A build/libs/lib
// ═══════════════════════════════════════════════════════════════════
task copyDependencies(type: Copy) {
    description = 'Copia todas las dependencias del runtimeClasspath a build/libs/lib'
    group = 'build'

    from configurations.runtimeClasspath
    into "${buildDir}/libs/lib"

    // Incluir librerías nativas de JavaFX (.dll, .so, .dylib)
    include '**/*.jar'
    include '**/*.dll'
    include '**/*.so'
    include '**/*.dylib'
}

// ═══════════════════════════════════════════════════════════════════
// 3. CONFIGURACIÓN DEL JAR CON MANIFEST
// ═══════════════════════════════════════════════════════════════════
jar {
    dependsOn copyDependencies

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Diferir la resolución del classpath a la fase de ejecución
    doFirst {
        manifest {
            attributes(
                'Main-Class': application.mainClass.get(),
                'Class-Path': configurations.runtimeClasspath.files.collect { "lib/${it.name}" }.join(' '),
                'Implementation-Title': project.name,
                'Implementation-Version': project.version ?: '1.0.0'
            )
        }
    }

    // Incluir recursos en el JAR
    from(sourceSets.main.resources) {
        include '**/*'
    }
}

// Tarea para construir todo listo para InstallBuilder
task buildForInstaller(dependsOn: ['clean', 'jar', 'copyDependencies']) {
    description = 'Construye el JAR y copia dependencias para InstallBuilder'
    group = 'distribution'

    doLast {
        println "═══════════════════════════════════════════════════════════"
        println " Build completado para InstallBuilder"
        println " JAR: ${buildDir}/libs/${project.name}.jar"
        println " Dependencias: ${buildDir}/libs/lib/"
        println "═══════════════════════════════════════════════════════════"
    }
}

// ═══════════════════════════════════════════════════════════════════
// DEPENDENCIAS
// ═══════════════════════════════════════════════════════════════════
dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.controlsfx:controlsfx:11.2.1'
    implementation 'io.github.mkpaz:atlantafx-base:2.0.1'
    implementation 'net.sf.jasperreports:jasperreports:7.0.1'
    implementation 'net.sf.jasperreports:jasperreports-pdf:7.0.1'
    implementation 'net.sf.jasperreports:jasperreports-charts:7.0.1'

    // OpenHTMLToPDF para exportar HTML con graficas a PDF
    implementation 'com.openhtmltopdf:openhtmltopdf-core:1.0.10'
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
}

// ═══════════════════════════════════════════════════════════════════
// RUNTIME + JPACKAGE (instalador nativo Windows)
// ═══════════════════════════════════════════════════════════════════
runtime {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']

    // Módulos Java necesarios (JavaFX los añade el plugin automáticamente)
    modules = [
        'java.base', 'java.desktop', 'java.logging',
        'java.net.http', 'java.sql', 'java.xml',
        'java.naming', 'java.management',
        'jdk.crypto.ec', 'jdk.unsupported'
    ]

    jpackage {
        imageName     = 'AutoReach'
        appVersion    = '1.0.0'
        vendor        = 'AutoReach'

        // 'app-image' → carpeta autocontenida, sin necesidad de WiX
        // Cambia a 'msi' si tienes WiX Toolset instalado (wixtoolset.org)
        installerType = 'app-image'

        // Icono: convierte autoIcon.png a autoIcon.ico y descomenta:
        // imageOptions = ['--icon', 'src/main/resources/Assets/autoIcon.ico']

        jvmArgs = [
            '--add-opens', 'javafx.graphics/javafx.scene=org.controlsfx.controls',
            '--add-opens', 'javafx.graphics/javafx.scene=ALL-UNNAMED'
        ]

        installerOptions = [
            '--description', 'AutoReach - Sistema de gestión de concesionario'
        ]
    }
}





